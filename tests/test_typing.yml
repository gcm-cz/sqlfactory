- case: select_join_json_table
  main: |
    from sqlfactory import Select
    from sqlfactory.func.json import JsonTable, JsonTableColumn
    from typing import assert_type

    jt = JsonTable("data", "$[*]", JsonTableColumn("name", "VARCHAR(50)", "$.name"))

    assert_type(Select(table="test").join(jt, alias="jt"), Select)
    assert_type(Select(table="test").JOIN(jt, alias="jt"), Select)
- case: distinct_only_on_aggregates_that_take_it
  main: |
    from sqlfactory.func.agg import AggregateFunction, DistinctAggregateFunction, Std, Sum
    from sqlfactory.func.spatial import StCollect

    Sum("x", distinct=True)
    StCollect("g", distinct=True)
    DistinctAggregateFunction("SUM", "x", distinct=True)
    Std("x", distinct=True)  # E: Unexpected keyword argument "distinct" for "Std"  [call-arg]
    AggregateFunction("STD", "x", distinct=True)  # E: Unexpected keyword argument "distinct" for "AggregateFunction"  [call-arg]
- case: any_query_where_a_subquery_goes
  main: |
    from sqlfactory import Column, Eq, Exists, In, Join, NotExists, NotIn, Select, Union, With
    from typing import assert_type

    u = Union(Select("a", table="t1"), Select("a", table="t2"))
    w = With("w").as_(Select("a", table="t1")).select(Select("a", table="w"))

    In("a", u)
    NotIn(("a", "b"), w)
    Exists(u)
    NotExists(w)
    Join(u, alias="u")
    assert_type(Select(table="test").join(u, alias="u", on=Eq("u.a", Column("test.a"))), Select)
    assert_type(Select(table="test").left_join(w, alias="w"), Select)
    Exists(Column("a"))  # E: Argument 1 to "Exists" has incompatible type "Column"; expected "Query"  [arg-type]
